<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="description" content="Trackademia: write naturally, and turn dates in your notes into Google Calendar reminders." />
    <title>Trackademia</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/icons/manifest.webmanifest" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app" aria-live="polite">
      <div class="boot-screen" role="status"><span class="spinner" aria-hidden="true"></span><span class="sr-only">Loading Trackademia…</span></div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>
    <div id="overlay-root"></div>
    <noscript>Trackademia needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
